; Fullbright College - Student Management System
; PHP overrides for containerized deployments.

; Database-backed sessions (see includes/session_bootstrap.php).
; The bootstrap itself checks SESSION_DRIVER=database before activating.
auto_prepend_file = /var/www/html/includes/session_bootstrap.php

; Uploads (2x2 ID photo + enrollment documents).
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 20

; Runtime data (student ID-card PNGs are written by PHP GD).
memory_limit = 256M

; Ensure PHP warnings never leak into HTML responses.
display_errors = Off
log_errors = On

date.timezone = Asia/Manila

; Session hardening (applies to file-based sessions; DB handler sets cookies
; itself). gc_maxlifetime keeps a session valid for up to 3 hours of inactivity.
session.gc_maxlifetime = 10800
session.cookie_httponly = 1
session.use_strict_mode = 1
