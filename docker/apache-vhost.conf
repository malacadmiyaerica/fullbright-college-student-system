# Fullbright College - Student Management System
# Apache virtual host / directory configuration for the container image.

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Protect sensitive includes and raw SQL from direct web access.
<FilesMatch "\.(sql|md|ini|sh|yml|yaml|env)$">
    Require all denied
</FilesMatch>
<Directory /var/www/html/includes>
    Require all denied
</Directory>
<Directory /var/www/html/docker>
    Require all denied
</Directory>
<Directory /var/www/html/docs>
    Require all denied
</Directory>

# Basic hardening headers.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
